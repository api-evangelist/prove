aid: prove
url: https://raw.githubusercontent.com/api-evangelist/prove/refs/heads/main/apis.yml
name: Prove
kind: company
description: Prove is a phone-centric digital identity verification and authentication
  platform. The Prove API (v3) uses the consumer's mobile phone number and cryptographic
  possession signals to power Pre-Fill identity prefill, passive Trust Score
  verification, Unified Authentication, and an Identity Manager - all behind an
  OAuth 2.0 secured REST interface at https://api.prove.com/v3.
accessModel:
  pricing: freemium
  onboarding: self-serve
  trial: false
  try_now: true
  public: false
  label: Freemium · Self-serve signup
  confidence: high
