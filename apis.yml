aid: prove
url: https://raw.githubusercontent.com/api-evangelist/prove/refs/heads/main/apis.yml
name: Prove
kind: company
description: Prove is a phone-centric digital identity verification and authentication platform. The Prove
  API (v3) uses the consumer's mobile phone number and cryptographic possession signals to power Pre-Fill
  identity prefill, passive Trust Score verification, Unified Authentication, phone-based Auth and a persistent
  Identity Manager - all behind an OAuth 2.0 client-credentials REST interface served from regional hosts
  (https://platform.proveapis.com/v3 for the US, https://platform.eu.proveapis.com/v3 for the EU, with
  UAT sandboxes for each). Official server SDKs ship for TypeScript, Go, Java and .NET, plus web and mobile
  Auth client SDKs and a public Postman workspace.
