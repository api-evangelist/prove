description: Prove runs a separate UAT (sandbox) environment per region beside production. Sandbox credentials are
  a project-scoped OAuth client ID and client secret created in the Prove Portal (Pre-Fill > New Project > Settings
  > Credentials) and exchanged at POST /token (client credentials). The Postman collection ships a pre-configured
  test user, "Milo Pinson", for walking the Pre-Fill flow (start -> validate -> challenge -> complete) against UAT.
  The full test-user catalog lives on a docs page that now redirects to a customer login.
